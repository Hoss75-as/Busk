<html lang="ru">

    <title>Будешь любить меня?</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif;
        }

        body {
            background-color: #ffe6eb;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Экран авторизации (Пароль) */
        .auth-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #ffe6eb;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .auth-card {
            background: #ffffff;
            padding: 30px;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(255, 105, 135, 0.3);
            text-align: center;
            width: 310px;
            border: 4px solid #ffccd5;
        }

        .auth-card h2 {
            color: #d81159;
            margin-bottom: 15px;
            font-size: 20px;
        }

        .auth-card input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 2px solid #ffccd5;
            border-radius: 12px;
            text-align: center;
            font-size: 18px;
            outline: none;
            letter-spacing: 4px;
        }

        .auth-card input:focus {
            border-color: #ff4d6d;
        }
